<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cautas - 予定を入れるだけ。あとは全部、繋がる。</title>
  <meta name="description" content="カウンセラー向け業務管理アプリ cautas（カウタス）。予約・カルテ・実績・請求を一元管理。予定を入れるだけで、あとは全部繋がる。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="cautas - 予定を入れるだけ。あとは全部、繋がる。">
  <meta property="og:description" content="カウンセラー向け業務管理アプリ。予約・カルテ・実績・請求を一元管理。">
  <meta property="og:site_name" content="cautas">
  <meta name="twitter:card" content="summary_large_image">
  <!-- favicon: インラインSVGでアイコン404を防止 -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');

    body { overflow: hidden; }

    /* ===== ローディング ===== */
    .loading-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #030308; z-index: 9999;
      display: flex; justify-content: center; align-items: center; overflow: hidden;
    }
    .loading-glitch-lines { position: absolute; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
    .glitch-line {
      position: absolute; width: 100%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,100,220,0.3), transparent);
      animation: glitchMove 2s infinite;
    }
    @keyframes glitchMove { 0%,100%{transform:translateX(-100%);opacity:0} 50%{transform:translateX(100%);opacity:1} }

    .loading-phase1 { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .phase1-line { font-size: 1.6rem; color: transparent; letter-spacing: 0.2em; position: relative; overflow: hidden; }
    .phase1-line::before {
      content: attr(data-text); position: absolute; top: 0; left: 0;
      width: 0; height: 100%; color: #fff; overflow: hidden; white-space: nowrap;
      border-right: 2px solid #ff64dc;
    }
    .phase1-line.typing::before      { animation: typing 0.6s steps(10) forwards; }
    .phase1-line.typing-done::before { border-right: none; width: 100%; }
    @keyframes typing { from{width:0}to{width:100%} }

    .loading-phase2 { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 20px; opacity: 0; transform: scale(0.8); }
    .logo-container { position: relative; width: 100px; height: 100px; display: flex; justify-content: center; align-items: center; }
    .logo-ring { position: absolute; width: 100%; height: 100%; border: 2px solid transparent; border-top-color: #ff64dc; border-radius: 50%; animation: logoSpin 1s linear infinite; }
    .logo-ring:nth-child(2) { width: 80%; height: 80%; border-top-color: #64dcff; animation-direction: reverse; animation-duration: 0.8s; }
    .logo-ring:nth-child(3) { width: 60%; height: 60%; border-top-color: #ffdc64; animation-duration: 0.6s; }
    @keyframes logoSpin { to{transform:rotate(360deg)} }
    .logo-center { width: 40px; height: 40px; background: linear-gradient(135deg,#ff64dc,#64dcff); border-radius: 50%; opacity: 0; transform: scale(0); }

    .brand-name { font-size: 3.5rem; font-weight: 700; letter-spacing: 0.4em; color: #fff; position: relative; text-transform: uppercase; }
    .brand-name::before,.brand-name::after { content:'cautas'; position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; }
    .brand-name::before { color:#ff64dc; animation:glitch1 0.3s infinite; clip-path:polygon(0 0,100% 0,100% 35%,0 35%); }
    .brand-name::after  { color:#64dcff; animation:glitch2 0.3s infinite; clip-path:polygon(0 65%,100% 65%,100% 100%,0 100%); }
    .brand-name.glitch-active::before,.brand-name.glitch-active::after { opacity:0.8; }
    @keyframes glitch1{0%,100%{transform:translate(0)}20%{transform:translate(-3px,2px)}40%{transform:translate(3px,-2px)}60%{transform:translate(-2px,1px)}80%{transform:translate(2px,-1px)}}
    @keyframes glitch2{0%,100%{transform:translate(0)}20%{transform:translate(3px,-2px)}40%{transform:translate(-3px,2px)}60%{transform:translate(2px,-1px)}80%{transform:translate(-2px,1px)}}
    .brand-tagline { font-size: 0.9rem; color: rgba(255,255,255,0.5); letter-spacing: 0.3em; text-transform: uppercase; opacity: 0; }

    .progress-container { position: absolute; bottom: 50px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
    .progress-circle { width: 50px; height: 50px; position: relative; }
    .progress-circle svg { transform: rotate(-90deg); }
    .progress-circle-bg  { fill:none; stroke:rgba(255,255,255,0.1); stroke-width:2; }
    .progress-circle-bar { fill:none; stroke:url(#progressGradient); stroke-width:2; stroke-linecap:round; stroke-dasharray:138.2; stroke-dashoffset:138.2; transition:stroke-dashoffset 0.1s ease; }
    .progress-text { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:0.7rem; color:rgba(255,255,255,0.7); font-family:monospace; }

    .shutter { position:fixed; top:0; left:0; width:100%; height:100%; z-index:10000; pointer-events:none; display:flex; }
    .shutter-panel { flex:1; background:#0a0a15; transform:scaleY(0); transform-origin:top; }
  </style>
</head>
<body>

  <!-- シャッター -->
  <div class="shutter" id="shutter">
    <div class="shutter-panel"></div><div class="shutter-panel"></div>
    <div class="shutter-panel"></div><div class="shutter-panel"></div>
    <div class="shutter-panel"></div>
  </div>

  <!-- ローディング -->
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-glitch-lines" id="glitchLines"></div>
    <div class="loading-phase1" id="loadingPhase1">
      <div class="phase1-line" id="line1" data-text="カウンセラーを">カウンセラーを</div>
      <div class="phase1-line" id="line2" data-text="助けるアプリ">助けるアプリ</div>
    </div>
    <div class="loading-phase2" id="loadingPhase2">
      <div class="logo-container">
        <div class="logo-ring"></div><div class="logo-ring"></div><div class="logo-ring"></div>
        <div class="logo-center" id="logoCenter"></div>
      </div>
      <div class="brand-name" id="brandName">cautas</div>
      <div class="brand-tagline" id="brandTagline">for counselors</div>
    </div>
    <div class="progress-container">
      <div class="progress-circle">
        <svg width="50" height="50">
          <defs>
            <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%"   stop-color="#ff64dc"/>
              <stop offset="50%"  stop-color="#64dcff"/>
              <stop offset="100%" stop-color="#ffdc64"/>
            </linearGradient>
          </defs>
          <circle class="progress-circle-bg"  cx="25" cy="25" r="22"/>
          <circle class="progress-circle-bar" id="progressBar" cx="25" cy="25" r="22"/>
        </svg>
        <div class="progress-text" id="progressText">0</div>
      </div>
    </div>
  </div>

  <!-- 背景スライドショー -->
  <div class="photo-slideshow" id="photoSlideshow"></div>
  <!-- 背景明るさオーバーレイ -->
  <div id="bg-light-overlay"></div>
  <!-- 奥行きビネット（背景写真の上・演出レイヤーの下） -->
  <div id="depth-vignette" aria-hidden="true"></div>

  <!-- スクロールヒント（本が開いたら表示、スクロールしたら消える） -->
  <div id="scroll-hint" aria-hidden="true">
    <div class="scroll-hint-mouse"><span class="scroll-hint-wheel"></span></div>
    <span class="scroll-hint-label">SCROLL</span>
  </div>

  <!-- Three.js canvas（GLBアイコン用） -->
  <canvas id="three-canvas"></canvas>

  <!-- 絵本シーン -->
  <div id="scene-notebook">
    <div id="book-gif-wrap">
      <img id="book-gif"
           src="public/images/characters/Cbook1.webp"
           alt="絵本アニメーション">
    </div>
  </div>

  <!-- スマホシーン -->
  <div id="scene-phone">
    <div id="cautas-letters">
      <span class="kautas-char">か</span>
      <span class="kautas-char">う</span>
      <span class="kautas-char">た</span>
      <span class="kautas-char">す</span>
    </div>
    <div id="phone-character">
      <img id="rabbit-img"
           src="public/images/characters/rabbitl.webp"
           alt="うさぎ">
    </div>
    <div id="big-phone">
      <img class="phone-img"
           src="public/images/characters/smartphone.webp"
           alt="スマホ">
      <div class="phone-screen">
        <div class="phone-status-bar"><span>9:41</span><span>●●●</span></div>
        <div class="phone-app-name">cautas</div>
        <div id="phone-icons-grid"></div>
      </div>
    </div>
  </div>

  <!-- 最終キャッチフレーズ -->
  <div id="final-catchphrase">
    <h1>予定を入れるだけ。<br>あとは全部、繋がる。</h1>
    <p>cautas — for counselors</p>
  </div>

  <!-- スクロールコンテナ -->
  <div class="scroll-container"><section class="hero"></section></div>

  <!-- ================================================================
       導入セクション：Before/After の2重構造
       奥 = 忙しく働く人（リアル動画）／手前 = アプリで快適に働くキャラ
       ※現在は仮素材（busy写真ループ＋歩くうさぎ）。本素材が出来たら差し替え：
         - 奥動画: .intro-photo 2枚を削除し、コメントアウトの <video> を有効化
         - 歩きキャラ: JS の WALKER_FRAMES に連番を列挙（下記参照）
       ================================================================ -->
  <section id="scene-intro">
    <div class="intro-sticky">
      <!-- 奥レイヤー：忙しい現実（モノクロ・暗め） -->
      <div class="intro-bg" id="introBg">
        <!-- 本番用（素材が出来たら有効化）:
        <video class="intro-video" src="public/videos/busy-loop.mp4"
               autoplay muted loop playsinline></video>
        -->
        <div class="intro-photo" style="background-image:url('public/images/photos/busy3.webp')"></div>
        <div class="intro-photo" style="background-image:url('public/images/photos/busy6.webp')"></div>
        <div class="intro-bg-tint"></div>
      </div>

      <!-- 手前レイヤー：温かい世界を歩くキャラ -->
      <div class="intro-fg">
        <div id="intro-walker">
          <img id="walker-img"
               src="public/images/characters/rabbitl.webp"
               alt="アプリを使って快適に働く人（仮キャラ）">
        </div>
      </div>

      <!-- コピー（仮） -->
      <div class="intro-copy">
        <p class="intro-copy-before">終わらない事務作業に、追われる毎日。</p>
        <h2 class="intro-copy-after">Cautasと歩けば、<br>仕事はもっと軽くなる。</h2>
      </div>
    </div>
  </section>

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <!-- Three.js r134（jsdelivr CDN） -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/GLTFLoader.js"></script>
  <!-- 質感強化用の環境光（読み込めなくても本体は動く） -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/environments/RoomEnvironment.js"></script>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    // リロード時にブラウザがスクロール位置を復元すると、絵本演出（0〜30%区間）を
    // 通り過ぎた状態で始まり演出が丸ごとスキップされるため、常に先頭から開始する
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    window.scrollTo(0, 0);

    // ================================================================
    // DOM参照（TDZ防止：最上部で全宣言）
    // ================================================================
    const loadingScreen  = document.getElementById('loadingScreen');
    const loadingPhase1  = document.getElementById('loadingPhase1');
    const loadingPhase2  = document.getElementById('loadingPhase2');
    const line1El        = document.getElementById('line1');
    const line2El        = document.getElementById('line2');
    const logoCenterEl   = document.getElementById('logoCenter');
    const brandNameEl    = document.getElementById('brandName');
    const brandTaglineEl = document.getElementById('brandTagline');
    const progressBarEl  = document.getElementById('progressBar');
    const progressTextEl = document.getElementById('progressText');
    const shutterPanels  = document.querySelectorAll('.shutter-panel');
    const sceneNotebook  = document.getElementById('scene-notebook');
    const bookGifEl      = document.getElementById('book-gif');
    // 絵本画像のload/errorデバッグ
    bookGifEl.addEventListener('load',  () => console.log('✅ bookGif ロード成功:', bookGifEl.src));
    bookGifEl.addEventListener('error', () => console.warn('❌ bookGif ロード失敗:', bookGifEl.src));
    const scenePhone     = document.getElementById('scene-phone');
    const kautasChars    = document.querySelectorAll('.kautas-char');
    const rabbitImg      = document.getElementById('rabbit-img');
    const circumference  = 2 * Math.PI * 22;

    // ================================================================
    // Three.js セットアップ（try-catchで安全に）
    // ================================================================
    let threeOK    = false;
    let glbMeshes  = [];
    let glbLoaded  = false;
    let glbRunning = false;
    let renderer3d = null;
    let scene3d    = null;
    let camera3d   = null;
    let loader3d   = null;

    try {
      const canvas3d = document.getElementById('three-canvas');
      renderer3d = new THREE.WebGLRenderer({ canvas: canvas3d, alpha: true, antialias: true });
      renderer3d.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer3d.setSize(window.innerWidth, window.innerHeight);
      try { renderer3d.outputEncoding = THREE.sRGBEncoding; } catch(e) {}

      scene3d  = new THREE.Scene();
      camera3d = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
      camera3d.position.set(0, 0, 14);

      scene3d.add(new THREE.AmbientLight(0xffffff, 1.2));
      const dL1 = new THREE.DirectionalLight(0xffeedd, 2.2); dL1.position.set(5, 10, 8);  scene3d.add(dL1);
      const dL2 = new THREE.DirectionalLight(0xaaddff, 1.5); dL2.position.set(-8, -3, 5); scene3d.add(dL2);

      // 質感強化：フィルミックなトーンマッピング＋環境光(IBL)で
      // 飛び出すアイコンに柔らかい反射と深みを追加（失敗しても本体は動く）
      try {
        renderer3d.toneMapping = THREE.ACESFilmicToneMapping;
        renderer3d.toneMappingExposure = 1.15;
        if (typeof THREE.RoomEnvironment === 'function') {
          const pmrem = new THREE.PMREMGenerator(renderer3d);
          scene3d.environment = pmrem.fromScene(new THREE.RoomEnvironment()).texture;
        }
      } catch(e) { console.warn('質感強化スキップ:', e.message); }

      if (typeof THREE.GLTFLoader !== 'undefined') {
        loader3d = new THREE.GLTFLoader();
        threeOK  = true;
        console.log('Three.js + GLTFLoader OK');
      } else {
        console.warn('GLTFLoader未定義 → アイコンはスキップ');
      }

      // レンダーループ
      (function loop() {
        requestAnimationFrame(loop);
        if (glbRunning) {
          glbMeshes.forEach(item => {
            if (!item.absorbed) {
              item.mesh.rotation.x += item.mesh.userData.rx;
              item.mesh.rotation.y += item.mesh.userData.ry;
              item.mesh.rotation.z += item.mesh.userData.rz;
            }
          });
        }
        renderer3d.render(scene3d, camera3d);
      })();

    } catch(e) {
      console.warn('Three.js初期化スキップ:', e.message);
    }

    // ================================================================
    // GLBファイル一覧（PCの icons フォルダに実際にあるもの）
    // ================================================================
    const GLB_BASE = 'public/images/icons/';
    const glbFiles = [
      'at.glb','book.glb','boy.glb','calculator.glb','calender.glb',
      'chart.glb','chat.glb','chat2.glb','clock.glb','computer.glb',
      'copy.glb','folder.glb','heart.glb',
      'mobile.glb','pencil.glb','video.glb',
    ];

    function screenToWorld(sx, sy) {
      if (!camera3d) return { x: 0, y: 0 };
      const vFOV = camera3d.fov * Math.PI / 180;
      const wH   = 2 * Math.tan(vFOV / 2) * camera3d.position.z;
      const wW   = wH * camera3d.aspect;
      return {
        x: (sx / window.innerWidth  - 0.5) * wW,
        y: -(sy / window.innerHeight - 0.5) * wH
      };
    }

    function loadAllGLBs(onDone) {
      if (!threeOK || !loader3d) { onDone(); return; }
      if (glbLoaded) { onDone(); return; }

      const TOTAL = glbFiles.length;
      let done    = 0;
      const origin = screenToWorld(window.innerWidth * 0.5, window.innerHeight * 0.5);
      const vFOV   = camera3d.fov * Math.PI / 180;
      const maxH   = 2 * Math.tan(vFOV / 2) * camera3d.position.z;
      const maxW   = maxH * camera3d.aspect;

      const check = () => { done++; if (done >= TOTAL) { glbLoaded = true; onDone(); } };

      glbFiles.forEach(file => {
        loader3d.load(
          GLB_BASE + file,
          gltf => {
            const m = gltf.scene;
            // 環境光の反射量を控えめに（白飛び防止・質感だけ乗せる）
            m.traverse(o => {
              if (o.isMesh && o.material && 'envMapIntensity' in o.material) {
                o.material.envMapIntensity = 0.45;
              }
            });
            const s = 0.25 + Math.random() * 0.7;
            m.scale.set(0.01, 0.01, 0.01);           // 最初は極小（見えない）
            m.userData.origScale = s;                  // 本来のスケールを保存
            m.position.set(origin.x, origin.y, 0);    // 画面中央に配置（上から落ちない）
            m.rotation.set(Math.random() * Math.PI * 2, Math.random() * Math.PI * 2, Math.random() * Math.PI * 2);
            m.userData.rx = (Math.random() - 0.5) * 0.04;
            m.userData.ry = (Math.random() - 0.5) * 0.06;
            m.userData.rz = (Math.random() - 0.5) * 0.03;
            m.visible = false;
            scene3d.add(m);
            glbMeshes.push({
              mesh:     m,
              tx:       (Math.random() - 0.5) * maxW * 1.1,
              ty:       (Math.random() - 0.5) * maxH * 0.9,
              tz:       (Math.random() - 0.5) * 4,
              origin:   { ...origin },
              absorbed: false
            });
            check();
          },
          undefined,
          err => { console.warn('GLB skip:', file); check(); }
        );
      });
    }

    function launchGLBs(onDone) {
      glbRunning = true;
      if (glbMeshes.length === 0) { if (onDone) onDone(); return; }

      let cnt = 0;
      glbMeshes.forEach((item, i) => {
        // 吸収済みフラグをリセット（スクロール戻り対応）
        item.absorbed = false;
        item.mesh.visible = true;
        // スケールをオリジナルに戻す（gsapが残っていても上書き）
        const s = item.mesh.userData.origScale || item.mesh.scale.x;
        item.mesh.userData.origScale = s;
        // 既存のgsapアニメをキル
        gsap.killTweensOf(item.mesh.position);
        gsap.killTweensOf(item.mesh.scale);
        // 原点にリセット
        item.mesh.position.set(item.origin.x, item.origin.y, 0);
        item.mesh.scale.set(0.01, 0.01, 0.01);

        gsap.to(item.mesh.position,
          { x: item.tx, y: item.ty, z: item.tz,
            duration: 0.6 + Math.random() * 0.6,
            delay:    i * 0.04 + Math.random() * 0.04,
            ease:     'power3.out',
            onComplete: () => { cnt++; if (cnt >= glbMeshes.length && onDone) setTimeout(onDone, 300); }
          }
        );
        gsap.to(item.mesh.scale,
          { x: s, y: s, z: s,
            duration: 0.5 + Math.random() * 0.4,
            delay: i * 0.04,
            ease: 'back.out(1.4)'
          }
        );
      });
    }

    function absorbGLBs() {
      if (!glbRunning || glbMeshes.length === 0) return;
      const r  = document.getElementById('big-phone').getBoundingClientRect();
      const pw = screenToWorld(r.left + r.width * 0.5, r.top + r.height * 0.5);
      // スマホの左端のworld座標（通過済みの範囲）
      const pwLeft = screenToWorld(r.left, r.top + r.height * 0.5);
      glbMeshes.forEach(item => {
        if (item.absorbed) return;
        const dx = item.mesh.position.x - pw.x;
        const dy = item.mesh.position.y - pw.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        // 近距離 or スマホより左に取り残されたGLBは強制吸収
        const leftBehind = item.mesh.position.x < pwLeft.x - 0.5;
        if (dist < 3.5 || leftBehind) {
          item.absorbed = true;
          const delay = leftBehind ? Math.random() * 0.3 : Math.random() * 0.15;
          gsap.to(item.mesh.position, { x: pw.x, y: pw.y, z: 0, duration: 0.5, ease: 'power2.in', delay });
          gsap.to(item.mesh.scale,    { x: 0,    y: 0,    z: 0,  duration: 0.4, ease: 'power2.in', delay });
        }
      });
    }

    // ================================================================
    // グリッチライン
    // ================================================================
    const glitchLinesEl = document.getElementById('glitchLines');
    for (let i = 0; i < 8; i++) {
      const ln = document.createElement('div');
      ln.className = 'glitch-line';
      ln.style.top = (Math.random() * 100) + '%';
      ln.style.animationDelay    = (Math.random() * 2) + 's';
      ln.style.animationDuration = (1 + Math.random()) + 's';
      glitchLinesEl.appendChild(ln);
    }

    // ================================================================
    // ローディングアニメーション
    // ================================================================
    let progress = 0;

    setTimeout(() => line1El.classList.add('typing'), 200);
    setTimeout(() => { line1El.classList.add('typing-done'); line2El.classList.add('typing'); }, 800);
    setTimeout(() => line2El.classList.add('typing-done'), 1400);
    setTimeout(() => {
      gsap.to(loadingPhase1, { opacity:0, scale:0.9, filter:'blur(10px)', duration:0.4, ease:'power2.in' });
      gsap.to(loadingPhase2, { opacity:1, scale:1,   duration:0.5, delay:0.3, ease:'back.out(1.5)' });
      gsap.to(logoCenterEl,  { opacity:1, scale:1,   duration:0.4, delay:0.5, ease:'back.out(2)' });
      setTimeout(() => {
        brandNameEl.classList.add('glitch-active');
        setTimeout(() => brandNameEl.classList.remove('glitch-active'), 300);
        setTimeout(() => {
          brandNameEl.classList.add('glitch-active');
          setTimeout(() => brandNameEl.classList.remove('glitch-active'), 200);
        }, 400);
      }, 600);
      gsap.to(brandTaglineEl, { opacity:1, duration:0.4, delay:0.9 });
    }, 1600);

    // 絵本コマ（Cbook1〜30）を実際に先読みし、完了までローディングを開けない。
    // これにより開いた瞬間からページめくりが即座に動く。
    // （CBOOK_FRAMES はスクリプト後方で宣言されるが、タイマー実行時には評価済み）
    let preloadedCount = 0;
    let assetsReady   = false;
    // セーフティ：先読みが極端に遅くても10秒で必ず開く
    setTimeout(() => { assetsReady = true; }, 10000);
    window.addEventListener('load', () => {
      const frames = CBOOK_FRAMES;
      frames.forEach(src => {
        const img = new Image();
        img.onload = img.onerror = () => {
          preloadedCount++;
          if (preloadedCount >= frames.length) assetsReady = true;
        };
        img.src = src;
      });
    });

    function updateProgress() {
      if (progress < 100) {
        progress += Math.random() * 4 + 2;
        // 実際の先読み進捗を超えないようキャップ（完了までは最大99%で待機）
        const realCap = assetsReady
          ? 100
          : Math.min(99, 40 + (preloadedCount / CBOOK_TOTAL) * 60);
        if (progress > realCap) progress = realCap;
        progressBarEl.style.strokeDashoffset = circumference - (progress / 100) * circumference;
        progressTextEl.textContent = Math.floor(progress);
        if (progress < 100) setTimeout(updateProgress, 30);
        else setTimeout(triggerShutter, 400);
      }
    }
    setTimeout(updateProgress, 300);

    // ================================================================
    // シャッター
    // ================================================================
    function triggerShutter() {
      gsap.to(shutterPanels, { scaleY: 1, duration: 0.3, stagger: 0.04, ease: 'power2.inOut' });
      gsap.delayedCall(0.55, () => {
        loadingScreen.style.display = 'none';
        document.body.style.overflow = 'auto';
        // ブラウザのスクロール位置復元は「スクロール可能になった瞬間」に遅延実行される
        // ことがあるため、ユーザーが操作するまでの間は先頭位置を強制する
        window.scrollTo(0, 0);
        let userScrolled = false;
        const markUser = () => { userScrolled = true; };
        ['wheel', 'touchstart', 'keydown', 'pointerdown'].forEach(ev =>
          window.addEventListener(ev, markUser, { once: true, passive: true }));
        const guard = setInterval(() => { if (!userScrolled) window.scrollTo(0, 0); }, 100);
        setTimeout(() => clearInterval(guard), 1500);
        gsap.to(shutterPanels, { scaleY: 0, duration: 0.4, stagger: 0.05, ease: 'power2.inOut', transformOrigin: 'bottom' });
        gsap.delayedCall(0.65, startBookAnimation);
      });
    }

    // ================================================================
    // 背景写真
    // ================================================================
    const photoSlideshow = document.getElementById('photoSlideshow');
    const photoUrls = [
      'public/images/photos/busy1.webp','public/images/photos/busy2.webp',
      'public/images/photos/busy3.webp','public/images/photos/busy4.webp',
      'public/images/photos/busy5.webp','public/images/photos/busy6.webp',
      'public/images/photos/busy7.webp','public/images/photos/busy8.webp'
    ];
    const slidingPhotos = [];

    for (let i = 0; i < 20; i++) {
      const img = document.createElement('img');
      img.src = photoUrls[i % photoUrls.length];
      img.className = 'sliding-photo';
      const d = Math.random();
      let size, opacity, blur, speed, zIndex;
      if      (d < 0.35) { size=80+Math.random()*70;   opacity=0.15+Math.random()*0.1; blur=4+Math.random()*2;   speed=0.15+Math.random()*0.10; zIndex=1; }
      else if (d < 0.70) { size=160+Math.random()*100; opacity=0.25+Math.random()*0.1; blur=2+Math.random()*1.5; speed=0.25+Math.random()*0.15; zIndex=3; }
      else               { size=350+Math.random()*150; opacity=0.35+Math.random()*0.1; blur=0;                   speed=0.40+Math.random()*0.20; zIndex=5; }
      img.style.cssText = `width:${size}px;height:${size*0.65}px;opacity:${opacity};filter:grayscale(50%) brightness(0.6) blur(${blur}px);z-index:${zIndex};`;
      const dirs=['left','right','top','bottom'], dir=dirs[Math.floor(Math.random()*4)];
      const angle=(Math.random()-0.5)*10, prog=Math.random();
      let sX,sY,eX,eY;
      if     (dir==='left')  {sX=-30;eX=110;sY=Math.random()*100;eY=sY+(Math.random()-0.5)*20;}
      else if(dir==='right') {sX=110;eX=-30;sY=Math.random()*100;eY=sY+(Math.random()-0.5)*20;}
      else if(dir==='top')   {sY=-30;eY=110;sX=Math.random()*100;eX=sX+(Math.random()-0.5)*20;}
      else                   {sY=110;eY=-30;sX=Math.random()*100;eX=sX+(Math.random()-0.5)*20;}
      const cX=sX+(eX-sX)*prog, cY=sY+(eY-sY)*prog;
      img.style.left=cX+'%'; img.style.top=cY+'%'; img.style.transform=`rotate(${angle}deg)`;
      photoSlideshow.appendChild(img);
      slidingPhotos.push({element:img,startX:sX,startY:sY,endX:eX,endY:eY,angle,speed,progress:prog,absorbed:false,currentX:cX,currentY:cY,direction:dir});
    }
    function animatePhotos() {
      slidingPhotos.forEach(p => {
        if (p.absorbed) return;
        p.progress += p.speed * 0.002;
        if (p.progress > 1.3) {
          p.progress = -0.3;
          const d=['left','right','top','bottom'];
          p.direction=d[Math.floor(Math.random()*4)]; p.angle=(Math.random()-0.5)*10;
          if     (p.direction==='left')  {p.startX=-30;p.endX=110;p.startY=Math.random()*100;p.endY=p.startY+(Math.random()-0.5)*20;}
          else if(p.direction==='right') {p.startX=110;p.endX=-30;p.startY=Math.random()*100;p.endY=p.startY+(Math.random()-0.5)*20;}
          else if(p.direction==='top')   {p.startY=-30;p.endY=110;p.startX=Math.random()*100;p.endX=p.startX+(Math.random()-0.5)*20;}
          else                           {p.startY=110;p.endY=-30;p.startX=Math.random()*100;p.endX=p.startX+(Math.random()-0.5)*20;}
        }
        p.currentX=p.startX+(p.endX-p.startX)*Math.max(0,p.progress);
        p.currentY=p.startY+(p.endY-p.startY)*Math.max(0,p.progress);
        p.element.style.left=p.currentX+'%';
        p.element.style.top=p.currentY+'%';
        p.element.style.transform=`rotate(${p.angle}deg)`;
      });
      requestAnimationFrame(animatePhotos);
    }
    animatePhotos();

    // ================================================================
    // スマホ内アイコン
    // ================================================================
    const organizedIcons = [
      {emoji:'📅',label:'カレンダー'},{emoji:'👤',label:'クライアント'},
      {emoji:'💬',label:'面談メモ'}, {emoji:'💰',label:'請求管理'},
      {emoji:'📋',label:'タスク'},   {emoji:'🔔',label:'通知'},
      {emoji:'📊',label:'レポート'}, {emoji:'📁',label:'書類'},
      {emoji:'⏰',label:'リマインダー'},
    ];
    const phoneGrid = document.getElementById('phone-icons-grid');
    organizedIcons.forEach(ic => {
      const item = document.createElement('div');
      item.className = 'phone-icon-item';
      item.innerHTML = `<div class="phone-icon-emoji">${ic.emoji}</div><div class="phone-icon-label">${ic.label}</div>`;
      phoneGrid.appendChild(item);
    });
    const phoneIconItems = document.querySelectorAll('.phone-icon-item');

    // ================================================================
    // ================================================================
    // 絵本Cbookコマ送り（スクロール連動）→ GLB飛び出し → 絵本消去
    // ================================================================
    // Cbook1〜30（連番・欠番なし）
    const CBOOK_FRAMES = Array.from({length: 30}, (_, i) =>
      `public/images/characters/Cbook${i + 1}.webp`
    );
    const CBOOK_TOTAL = CBOOK_FRAMES.length;  // 30枚
    // GLB飛び出しは Cbook17 → index 16
    // （速いスクロールでフレームが飛んでも発火するよう「到達済み」判定にする）
    const GLB_LAUNCH_INDEX = 16;
    // ===== GLB飛び出し原点の調整 =====
    // GLB_ORIGIN_Y: 0.0=画面上端, 0.5=中央, 1.0=下端
    // 絵本ページが画面下半分にある場合は 0.55〜0.70 が目安
    const GLB_ORIGIN_Y = 0.60;  // ← ここを変えて縦位置を調整
    let bookStarted    = false;
    let bookDismissed  = false;
    let glbLaunched    = false;
    let cbookST        = null;  // ScrollTriggerインスタンス

    function startBookAnimation() {
      if (bookStarted) return;
      bookStarted = true;
      console.log('▶ startBookAnimation: Cbookスクロールアニメ開始');

      // --- 最初のフレームを表示してフェードイン ---
      bookGifEl.src = CBOOK_FRAMES[0];
      sceneNotebook.style.display = 'flex';
      sceneNotebook.style.opacity = '0';

      gsap.fromTo(sceneNotebook,
        { opacity: 0, scale: 0.8, y: 40 },
        { opacity: 1, scale: 1,   y: 0, duration: 0.7, ease: 'back.out(1.4)',
          onComplete: () => console.log('▶ 絵本フェードイン完了 → スクロールでページを進めてください') }
      );

      // --- GLBをバックグラウンドでロード開始 ---
      loadAllGLBs(() => console.log('GLBロード完了:', glbMeshes.length + '個'));

      // --- ScrollTrigger: 0%〜30%でCbook1→2→...→32のコマ送り ---
      // Cbook17（17/32≒53%）到達でGLB飛び出し、Cbook32でフェードアウト
      cbookST = ScrollTrigger.create({
        trigger: '.scroll-container',
        start:   'top top',
        end:     '30% top',
        scrub:   0.4,
        onUpdate(self) {
          const idx = Math.min(
            Math.floor(self.progress * CBOOK_TOTAL),
            CBOOK_TOTAL - 1
          );
          if (bookGifEl.dataset.frame != idx) {
            bookGifEl.dataset.frame = idx;
            bookGifEl.src = CBOOK_FRAMES[idx];
          }
      // Cbook17以降に到達でGLB飛び出し（一度だけ・フレーム飛ばしでも発火）
          if (!glbLaunched && idx >= GLB_LAUNCH_INDEX) {
            glbLaunched = true;
            console.log('▶ Cbook17到達 → GLB飛び出し');
            const r  = bookGifEl.getBoundingClientRect();
            const ow = screenToWorld(r.left + r.width * 0.5, r.top + r.height * GLB_ORIGIN_Y);
            glbMeshes.forEach(item => {
              item.origin = ow;
              item.mesh.position.set(ow.x, ow.y, 0);
            });
            if (glbLoaded) {
              launchGLBs(() => {});  // dismissBookはCbook32後に呼ぶ
            } else {
              const wait = () => glbLoaded ? launchGLBs(() => {}) : (threeOK ? setTimeout(wait, 200) : void 0);
              wait();
            }
          }
        },
        onLeave() {
          // Cbook32到達 → 絵本フェードアウト
          if (!bookDismissed) {
            bookGifEl.src = CBOOK_FRAMES[CBOOK_TOTAL - 1];
            dismissBook();
          }
        },
        onLeaveBack() {
          // 戻りスクロールしたら絵本を再表示・GLBを非表示にリセット
          bookDismissed = false;
          glbLaunched   = false;
          glbRunning    = false;
          // GLBを全て非表示に戻す
          glbMeshes.forEach(item => {
            gsap.killTweensOf(item.mesh.position);
            gsap.killTweensOf(item.mesh.scale);
            item.mesh.visible = false;
            item.absorbed     = false;
            item.mesh.scale.set(0.01, 0.01, 0.01);
          });
          // 絵本を最初のフレームで再表示
          bookGifEl.src = CBOOK_FRAMES[0];
          bookGifEl.dataset.frame = 0;
          sceneNotebook.style.display = 'flex';
          gsap.to(sceneNotebook, { opacity: 1, scale: 1, y: 0, duration: 0.4 });
        }
      });
    }

    function dismissBook() {
      if (bookDismissed) return;
      bookDismissed = true;
      // 下に引っ張りながら消える（画面高さ分以上下にスライド）
      gsap.to(sceneNotebook, {
        y: window.innerHeight * 1.2,  // 画面高さ120%下にスライドアウト
        opacity: 0,                   // 消えながら少しフェード
        duration: 1.5,
        ease: 'power1.inOut',         // 最初ゆっくり、均等に落ちる
        onComplete: () => {
          sceneNotebook.style.display = 'none';
          gsap.set(sceneNotebook, { y: 0 }); // 次回のために位置リセット
        }
      });
    }

    // ================================================================
    // スマホスクロール連動
    // ================================================================
    const RABBIT_L = 'public/images/characters/rabbitl.webp';
    const RABBIT_R = 'public/images/characters/rabbitr.webp';
    const STEPS = organizedIcons.length;
    let currentStep  = -1;
    let phoneStarted = false;

    // かうたす文字バウンス
    kautasChars.forEach((ch, i) => {
      gsap.to(ch, { y:-16, duration:0.32, yoyo:true, repeat:-1, ease:'power1.inOut', delay:i*0.12 });
      gsap.to(ch, { rotation:(i%2===0)?-6:6, duration:0.45, yoyo:true, repeat:-1, ease:'sine.inOut', delay:i*0.12 });
    });

    function switchRabbit(step) {
      const src = (step % 2 === 0) ? RABBIT_L : RABBIT_R;
      gsap.timeline()
        .to(rabbitImg, { scaleY:0.75, scaleX:1.1, duration:0.07, ease:'power2.in',
            onComplete: () => { rabbitImg.src = src; } })
        .to(rabbitImg, { scaleY:1.12, scaleX:0.92, duration:0.08, ease:'power2.out' })
        .to(rabbitImg, { scaleY:1,    scaleX:1,    duration:0.12, ease:'elastic.out(1.2,0.5)' });
    }

    function stepPhone(step) {
      const vw   = window.innerWidth;
      const xPos = -vw * 0.55 + (vw * 0.55 + vw * 0.70) * (step / (STEPS - 1));
      gsap.to('#phone-character', { y:-18, duration:0.12, ease:'power2.out', yoyo:true, repeat:1 });
      switchRabbit(step);
      gsap.to(scenePhone, {
        x: xPos, duration:0.45, ease:'back.out(1.2)',
        onComplete: () => {
          absorbGLBs();
          absorbPhotos();
          showIcon(step);
        }
      });
    }

    function absorbPhotos() {
      const r   = document.getElementById('big-phone').getBoundingClientRect();
      const pcx = r.left + r.width  * 0.5;
      const pcy = r.top  + r.height * 0.5;
      slidingPhotos.forEach(p => {
        if (p.absorbed) return;
        const pr = p.element.getBoundingClientRect();
        const px = pr.left + pr.width  * 0.5;
        const py = pr.top  + pr.height * 0.5;
        if (Math.hypot(px - pcx, py - pcy) < r.width * 1.4) {
          p.absorbed = true;
          gsap.to(p.element, { x:pcx-px, y:pcy-py, scale:0, opacity:0, duration:0.6, ease:'power2.in', delay:Math.random()*0.2 });
        }
      });
    }

    function showIcon(step) {
      const item = phoneIconItems[step];
      if (item) gsap.to(item, { opacity:1, scale:1, duration:0.35, ease:'back.out(2)' });
    }

    // end は「90% bottom」：旧値の「90% top」はページ最下部より奥で物理的に到達不能となり、
    // 最後のアイコンが永遠に表示されなかったため（画面高ぶん手前=bottom基準に修正）
    ScrollTrigger.create({
      trigger: '.scroll-container', start: '35% top', end: '90% bottom',
      onEnter() {
        // スマホ登場 → 背景を明るく（overlayをfade in）
        gsap.to('#bg-light-overlay', {
          backgroundColor: 'rgba(200,180,255,0.18)',
          duration: 1.8,
          ease: 'power2.out'
        });
        // body背景色も少し明るく
        gsap.to('body', {
          backgroundColor: '#12102a',
          duration: 1.8,
          ease: 'power2.out'
        });
      },
      onLeaveBack() {
        // スクロール戻り → 背景を暗く戻す
        gsap.to('#bg-light-overlay', {
          backgroundColor: 'rgba(200,180,255,0)',
          duration: 1.0,
          ease: 'power2.in'
        });
        gsap.to('body', {
          backgroundColor: '#030308',
          duration: 1.0,
          ease: 'power2.in'
        });
      },
      onUpdate(self) {
        if (!phoneStarted && self.progress > 0) {
          phoneStarted = true;
          gsap.set(scenePhone, { x: -window.innerWidth * 0.55 });
        }
        const s = Math.min(Math.floor(self.progress * STEPS), STEPS - 1);
        if (s !== currentStep) { currentStep = s; stepPhone(s); }
      }
    });

    // ================================================================
    // 最終キャッチフレーズ
    // ================================================================
    // start/end を bottom 基準に修正：旧値「91% top」はどの画面サイズでも到達不能で、
    // 最終キャッチコピーが一度も表示されなかった
    ScrollTrigger.create({
      trigger: '.scroll-container', start: '91% bottom', end: 'bottom bottom',
      onEnter() {
        gsap.to('#final-catchphrase', { opacity:1, filter:'blur(0px)', duration:0.8, ease:'power2.out' });
        gsap.to(scenePhone, { x:window.innerWidth*1.3, duration:0.8, ease:'power2.in', delay:0.2 });
      },
      onLeaveBack() { gsap.to('#final-catchphrase', { opacity:0, filter:'blur(14px)', duration:0.4 }); }
    });

    // ================================================================
    // 導入セクション：奥=忙しい現実 / 手前=歩くキャラ（Before/After）
    // ================================================================
    // 本番の歩きキャラ連番が出来たらここを差し替える（Cbookと同じ方式）。
    // 例: const WALKER_FRAMES = Array.from({length: 6}, (_, i) =>
    //       `public/images/characters/walk${i + 1}.webp`);
    // いまは仮素材：透過済みのうさぎ2ポーズをトコトコ切替
    const WALKER_FRAMES = [
      'public/images/characters/rabbitl.webp',
      'public/images/characters/rabbitr.webp'
    ];
    const WALK_CYCLES   = 9;   // セクション通過中に歩きサイクルを回す回数
    const walkerImg     = document.getElementById('walker-img');

    // 連番の先読み（本素材が入ったら自動で効く）
    WALKER_FRAMES.forEach(src => { const im = new Image(); im.src = src; });

    // キャラがスクロールに合わせて左から右へ歩き切る
    gsap.fromTo('#intro-walker',
      { x: '-45vw' },
      {
        x: '110vw',
        ease: 'none',
        scrollTrigger: {
          trigger: '#scene-intro',
          start: 'top top',
          end: 'bottom bottom',
          scrub: 0.6,
          onUpdate(self) {
            if (WALKER_FRAMES.length > 1) {
              const idx = Math.floor(self.progress * WALK_CYCLES * WALKER_FRAMES.length)
                          % WALKER_FRAMES.length;
              if (walkerImg.dataset.f != idx) {
                walkerImg.dataset.f = idx;
                walkerImg.src = WALKER_FRAMES[idx];
              }
            }
          }
        }
      }
    );

    // コピーの表示（キャラが中央あたりに来たタイミング）
    ScrollTrigger.create({
      trigger: '#scene-intro',
      start: '30% top',
      onEnter: () => gsap.to('.intro-copy',
        { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.9, ease: 'power2.out' }),
      onLeaveBack: () => gsap.to('.intro-copy',
        { opacity: 0, y: 24, filter: 'blur(10px)', duration: 0.4, ease: 'power2.in' })
    });
    gsap.set('.intro-copy', { y: 24, filter: 'blur(10px)' });

    // ================================================================
    // スクロールヒント：絵本が開いたら表示、スクロールしたら消える
    // ================================================================
    (function initScrollHint() {
      const hint = document.getElementById('scroll-hint');
      if (!hint) return;
      let hidden = false;
      const waitBook = setInterval(() => {
        if (bookStarted) {
          clearInterval(waitBook);
          if (!hidden) gsap.to(hint, { opacity: 1, duration: 0.8, delay: 1.2, ease: 'power2.out' });
        }
      }, 200);
      window.addEventListener('scroll', () => {
        if (!hidden && window.scrollY > 40) {
          hidden = true;
          gsap.killTweensOf(hint);
          gsap.to(hint, { opacity: 0, y: 12, duration: 0.5, ease: 'power2.in' });
        }
      }, { passive: true });
    })();

    // ================================================================
    // リサイズ
    // ================================================================
    window.addEventListener('resize', () => {
      if (camera3d) {
        camera3d.aspect = window.innerWidth / window.innerHeight;
        camera3d.updateProjectionMatrix();
      }
      if (renderer3d) renderer3d.setSize(window.innerWidth, window.innerHeight);
      clearTimeout(window._rt);
      window._rt = setTimeout(() => ScrollTrigger.refresh(), 250);
    });
  </script>
</body>
</html>
